<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da Máquina</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <section id="tela-login" hidden>
    <form id="form-login" class="cartao" autocomplete="off">
      <h1>Painel da Máquina</h1>
      <label for="token">Token de acesso</label>
      <input id="token" name="token" type="password" required maxlength="256" autocomplete="off">
      <p id="msg-login" role="alert" class="erro"></p>
      <button type="submit" class="primario">Entrar</button>
    </form>
  </section>

  <section id="tela-app" hidden>
    <header>
      <strong>Painel da Máquina</strong>
      <nav id="abas" aria-label="Áreas do painel">
        <button type="button" class="aba" data-aba="terminais">Terminais</button>
        <button type="button" class="aba" data-aba="tarefas">Tarefas</button>
        <button type="button" class="aba" data-aba="servicos">Serviços</button>
        <button type="button" class="aba" data-aba="processos">Processos</button>
      </nav>
      <span id="selo-admin" class="selo" hidden>administrador</span>
      <span id="aviso-exposto" class="selo aviso" hidden>exposto fora do loopback</span>
      <button id="botao-sair" type="button">Sair</button>
    </header>

    <main>
      <section id="aba-terminais" class="painel-aba" hidden>
        <div class="barra">
          <label class="inline">Shell
            <select id="term-shell"></select>
          </label>
          <input id="term-pasta" type="text" placeholder="Pasta inicial (opcional)" maxlength="260" aria-label="Pasta inicial">
          <input id="term-nome" type="text" placeholder="Nome (opcional)" maxlength="60" aria-label="Nome da sessão">
          <button id="term-nova" type="button" class="primario-inline">Nova sessão</button>
        </div>
        <div id="term-sessoes" class="sessoes" role="tablist" aria-label="Sessões de terminal"></div>
        <p id="term-vazio" class="vazio">Nenhuma sessão aberta. Crie uma para começar.</p>
        <div id="term-area" class="term-area" hidden>
          <div id="term-aviso" class="term-aviso" role="status" hidden></div>
          <div id="term-container" class="term-container"></div>
        </div>
      </section>

      <section id="aba-tarefas" class="painel-aba" hidden>
        <h1 class="titulo-aba">Tarefas agendadas</h1>
        <div class="barra">
          <input id="tarefas-filtro" type="search" placeholder="Filtrar por nome" aria-label="Filtrar tarefas">
          <label class="inline"><input id="tarefas-todas" type="checkbox"> Mostrar tarefas do Windows</label>
          <button id="tarefas-atualizar" type="button">Atualizar</button>
          <button id="tarefas-nova" type="button" class="primario-inline">Nova tarefa</button>
        </div>
        <div id="tarefas-tabela"></div>
      </section>

      <section id="aba-servicos" class="painel-aba" hidden>
        <h1 class="titulo-aba">Serviços do Windows</h1>
        <div class="barra">
          <input id="servicos-filtro" type="search" placeholder="Filtrar por nome" aria-label="Filtrar serviços">
          <select id="servicos-estado" aria-label="Filtrar por estado">
            <option value="">Todos os estados</option>
            <option value="Running">Em execução</option>
            <option value="Stopped">Parado</option>
          </select>
          <button id="servicos-atualizar" type="button">Atualizar</button>
          <button id="servicos-novo" type="button" class="primario-inline">Novo serviço</button>
        </div>
        <div id="servicos-tabela"></div>
      </section>

      <section id="aba-processos" class="painel-aba" hidden>
        <h1 class="titulo-aba">Processos e portas</h1>
        <div class="barra">
          <input id="processos-filtro" type="search" placeholder="Filtrar por nome, PID ou porta" aria-label="Filtrar processos e portas">
          <button id="processos-atualizar" type="button">Atualizar</button>
        </div>
        <h2 class="subtitulo">Portas em escuta</h2>
        <div id="processos-portas"></div>
        <h2 class="subtitulo">Processos (por uso de memória)</h2>
        <div id="processos-lista"></div>
      </section>
    </main>
  </section>

  <dialog id="dialogo"></dialog>
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/ui.js"></script>
  <script src="/app.js"></script>
  <script src="/terminais.js"></script>
  <script src="/tarefas.js"></script>
  <script src="/servicos.js"></script>
  <script src="/processos.js"></script>
  <script src="/iniciar.js"></script>
</body>
</html>
