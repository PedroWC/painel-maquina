<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipo — Login</title>
  <link rel="stylesheet" href="wireframe.css">
</head>
<body>
  <main>
    <div class="modal" style="margin-top:12vh">
      <h1>Painel da Máquina</h1>
      <label for="token">Token de acesso</label>
      <input id="token" type="password" placeholder="Cole o token gerado na instalação" autocomplete="off">
      <p class="nota">Após 5 tentativas inválidas, o acesso fica bloqueado por 5 minutos (RN-01).</p>
      <div class="fim"><button class="primary">Entrar</button></div>
    </div>
    <p class="nota" style="text-align:center">Protótipo estático · RF-01 · UC-01 · US-01</p>
  </main>
</body>
</html>
